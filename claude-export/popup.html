<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #da7756;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover {
      background: #c4684a;
    }
    button:disabled {
      background: #ccc;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 13px;
      min-height: 20px;
    }
    .error {
      color: #d32f2f;
    }
    .success {
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <h3>Claude Export</h3>
  <button id="exportBtn">Export to Markdown</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
